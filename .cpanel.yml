---

deployment:

  tasks:

    - set -xe

    # Ensure Node is on PATH; adjust if your host uses a different path

    - export PATH="/opt/cpanel/ea-nodejs20/bin:$PATH"

    - node -v

    - npm -v

    # Build-time env + reproducible installs

    - export APPDIR="$(pwd)"

    - export OUTDIR="$APPDIR/out"

    - export DEPLOYPATH="/home/datapant/public_html/nextjs-app-new/"

    - export BASEPATH="/nextjs-app-new"

    - export CI=true NPM_CONFIG_FUND=false NPM_CONFIG_AUDIT=false

    # Clean, install, build, export

    - /bin/rm -rf "$APPDIR/node_modules" "$OUTDIR"

    - /bin/npm --prefix "$APPDIR" ci

    - /usr/bin/env BASEPATH="$BASEPATH" /bin/npm --prefix "$APPDIR" run build

    - /usr/bin/env BASEPATH="$BASEPATH" /bin/npx --yes --prefix "$APPDIR" next export -o "$OUTDIR"

    # Publish atomically

    - /bin/mkdir -p "$DEPLOYPATH"

    - /bin/rsync -avr --delete "$OUTDIR"/ "$DEPLOYPATH"

