# Local development: runs the API at http://localhost:8000 (docs at /docs).
# The website is a static Next.js build, so run it separately: cd frontend && npm run dev
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend/app:/app/app   # live code changes
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
