# Local Postgres for development. Run from backend/:  docker compose up -d
# Credentials come from backend/.env (see .env.example), with the defaults below.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datapanther}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datapanther}
      POSTGRES_DB: ${POSTGRES_DB:-datapanther}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
